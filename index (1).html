<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Grimoire maudit – Escape game d’Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2e7cf;
  --surface: #fbf4e2;
  --ink: #2b1638;
  --muted: #5f4a6b;
  --accent: #c24a0a;
  --accent-ink: #fff8ee;
  --ok: #2f7d32;
  --warn: #a4262c;
  --line: #cdb98f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c0f2a;
    --surface: #2a1740;
    --ink: #f1e6cf;
    --muted: #bba9cb;
    --accent: #ff8a2b;
    --accent-ink: #2b1200;
    --ok: #9be564;
    --warn: #ff9a9a;
    --line: #4d3269;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c0f2a;
  --surface: #2a1740;
  --ink: #f1e6cf;
  --muted: #bba9cb;
  --accent: #ff8a2b;
  --accent-ink: #2b1200;
  --ok: #9be564;
  --warn: #ff9a9a;
  --line: #4d3269;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1.2rem;
  line-height: 1.5;
}
.display { font-family: "Metamorphous", Georgia, "Times New Roman", serif; font-weight: 400; }
.wrap { max-width: 36rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
.brand { font-size: 1.05rem; color: var(--muted); }
.timer { font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--accent); }
h1.title { font-size: clamp(2.3rem, 9vw, 3.2rem); line-height: 1.1; margin: 2rem 0 1rem; }
h2.page-title { font-size: 1.6rem; line-height: 1.2; margin: 0 0 1rem; }
.lead { font-size: 1.3rem; }
.rules { margin: 1.25rem 0 2rem; padding-left: 1.2rem; color: var(--muted); }
.rules li { margin-bottom: .35rem; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  min-height: 3rem; padding: .7rem 1.3rem;
  border: 2px solid var(--accent); border-radius: .4rem;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.seals { display: flex; gap: .6rem; justify-content: center; margin: 0 0 1.5rem; padding: 0; list-style: none; }
.seal {
  width: 2.6rem; height: 2.6rem; border-radius: 50%;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-family: "Metamorphous", Georgia, serif; font-size: 1rem; color: var(--muted);
}
.seal.current { border-color: var(--accent); color: var(--accent); border-width: 3px; }
.seal.done { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.page {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: .4rem; padding: 1.5rem 1.4rem;
}
.riddle { font-size: 1.3rem; margin: 0 0 1rem; }
.code { font-family: "Metamorphous", Georgia, serif; font-size: 1.5rem; letter-spacing: .08em; text-align: center; margin: 1.25rem 0; }
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.7rem, 1fr)); gap: .3rem; font-size: .95rem; margin: 1rem 0; color: var(--muted); }
.alpha span { border: 1px solid var(--line); border-radius: .25rem; padding: .1rem .35rem; text-align: center; }
.alpha b { color: var(--ink); }
.poem, .statements { margin: 1rem 0; border-left: 4px solid var(--line); padding: .3rem 0 .3rem 1.1rem; }
.poem { font-style: italic; }
.statements { list-style-position: inside; }
ul.statements { list-style: none; }
.statements li { margin: .45rem 0; }
.opts { display: grid; gap: .6rem; margin: 1rem 0; }
.opt { font: inherit; text-align: left; min-height: 3rem; padding: .7rem 1rem; border: 2px solid var(--line); border-radius: .4rem; background: var(--bg); color: var(--ink); cursor: pointer; }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.right, .opt.right:disabled { background: var(--ok); border-color: var(--ok); color: var(--bg); font-weight: 700; }
.opt.wrong, .opt.wrong:disabled { border-color: var(--warn); color: var(--warn); font-weight: 700; }
label { display: block; font-weight: 700; margin: 1.25rem 0 .4rem; }
input[type="text"] {
  width: 100%; font: inherit; padding: .7rem .8rem;
  border: 2px solid var(--line); border-radius: .4rem;
  background: var(--bg); color: var(--ink);
}
.row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
.msg { min-height: 1.6em; margin: .9rem 0 0; font-weight: 500; }
.msg.bad { color: var(--warn); }
.msg.good { color: var(--ok); }
.hint { margin-top: 1rem; padding: .8rem 1rem; border-left: 4px solid var(--accent); background: var(--bg); }
.answer-line { font-family: "Metamorphous", Georgia, serif; font-size: 1.3rem; color: var(--ok); margin: 0 0 .5rem; }
.stats { color: var(--muted); margin: .5rem 0 1.5rem; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: .4rem; padding: 1.5rem 1.4rem; margin-bottom: 1.25rem; }
.fiche .blank { margin-top: 1.5rem; border-bottom: 2px solid var(--ink); height: 2.2rem; }
.fiche .blank-label { font-weight: 700; margin-top: 1.25rem; }
@media (prefers-reduced-motion: no-preference) {
  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
}
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #000; --accent: #000; --ok: #000;
    padding: 0;
  }
  .no-print { display: none !important; }
  body { font-size: 15pt; }
  .fiche { page-break-after: always; break-after: page; border: 2px solid #000; padding: 2rem; margin: 0; }
  .fiche:last-child { page-break-after: auto; break-after: auto; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
var RIDDLES = [
  {
    title: "Le sceau du poème",
    text: "Sur le premier feuillet du grimoire, un poème. Il cache le nom de l’objet dans lequel la sorcière prépare ses potions. À vous de le trouver.",
    extra: '<p class="poem">Cette nuit, la lune éclaire le cimetière,<br>Hibou et corbeaux guettent la clairière.<br>Autour du feu, les sorcières murmurent<br>Un sortilège aux paroles obscures.<br>Dans l’ombre, un chat noir se faufile,<br>Rôde sans bruit, discret et agile.<br>Où se cache le trésor des sorcières&nbsp;?<br>Nul ne le sait, et la nuit est entière.</p>',
    answers: ["chaudron"],
    show: "CHAUDRON",
    hint: "Regardez la première lettre de chaque vers.",
    mode: "text"
  },
  {
    title: "Le sceau du code",
    text: "Le feuillet suivant est écrit en code. Chaque lettre a été remplacée par celle qui se trouve 3 rangs plus loin dans l’alphabet&nbsp;: A devient D, B devient E, et ainsi de suite. Pour décoder, il faut reculer de 3 rangs. Quelle créature de la nuit se cache ici&nbsp;?",
    extra: "code",
    answers: ["vampire"],
    show: "VAMPIRE",
    hint: "Y recule de 3 rangs&nbsp;: X, W, V. La première lettre est donc V.",
    mode: "text"
  },
  {
    title: "Le sceau des fioles",
    text: "Sur l’étagère de la sorcière, les fioles sont numérotées dans un ordre précis. Quel numéro porte la fiole suivante&nbsp;?",
    extra: '<p class="code">2 – 6 – 12 – 20 – 30 – ?</p>',
    answers: ["42"],
    show: "42",
    hint: "Regardez l’écart entre deux nombres qui se suivent&nbsp;: il change à chaque fois.",
    mode: "numeric"
  },
  {
    title: "Le sceau du voleur",
    text: "La potion a été volée par l’un de ces trois suspects. Un seul dit la vérité, les deux autres mentent. Qui est le voleur&nbsp;?",
    extra: '<ul class="statements"><li><b>La Momie</b>&nbsp;: «&nbsp;Ce n’est pas moi.&nbsp;»</li><li><b>Le Fantôme</b>&nbsp;: «&nbsp;C’est la Momie.&nbsp;»</li><li><b>Le Squelette</b>&nbsp;: «&nbsp;Ce n’est pas le Fantôme.&nbsp;»</li></ul>',
    answers: ["fantome"],
    show: "FANTOME",
    hint: "Supposez que le voleur est la Momie, puis le Fantôme, puis le Squelette. À chaque fois, comptez combien de phrases sont vraies&nbsp;: il doit y en avoir une seule.",
    mode: "text"
  },
  {
    title: "Le dernier sceau",
    text: "Pour ouvrir le grimoire, il faut un mot de passe de 5 lettres, construit avec vos quatre réponses précédentes (écrites sans accent).",
    extra: '<ol class="statements"><li>1re lettre&nbsp;: la 1re lettre de la réponse 1</li><li>2e lettre&nbsp;: la 6e lettre de la réponse 2</li><li>3e lettre&nbsp;: la 2e lettre de la réponse 4</li><li>4e lettre&nbsp;: la 8e lettre de la réponse 1</li><li>5e lettre&nbsp;: dans la réponse 2, la lettre dont le rang est la réponse 3 divisée par 6</li></ol>',
    answers: ["crane"],
    show: "CRÂNE",
    hint: "La réponse 3 est 42, et 42 divisé par 6 donne 7. Comptez donc 7 lettres dans la réponse 2.",
    mode: "text"
  }
];

var ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
var CODE = "YDPSLUH";

var app = document.getElementById("app");
var st = { screen: "intro", i: 0, solved: false, hintsShown: {}, start: 0, secs: 0, timer: null };

function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}
function check(r, value) {
  var v = norm(value);
  if (!v) return false;
  return r.answers.some(function (a) {
    return /^\d+$/.test(a) ? v === a : v.indexOf(a) !== -1;
  });
}
function mmss(s) {
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
}
function hintCount() { return Object.keys(st.hintsShown).length; }
function tick() {
  st.secs = Math.floor((Date.now() - st.start) / 1000);
  var t = document.getElementById("timer");
  if (t) t.textContent = mmss(st.secs);
}
function startGame() {
  var tf = document.getElementById("team");
  st.team = tf ? tf.value.trim() : "";
  st.screen = "game"; st.i = 0; st.solved = false; st.hintsShown = {};
  st.start = Date.now(); st.secs = 0;
  clearInterval(st.timer);
  st.timer = setInterval(tick, 1000);
  render();
}
function altarExtra(r) {
  if (r.extra === "code") {
    var cells = ALPHABET.map(function (l) { return "<span><b>" + l + "</b></span>"; }).join("");
    return '<p class="code" aria-label="Message codé">' + CODE + '</p><div class="alpha" aria-label="Alphabet">' + cells + "</div>";
  }
  return r.extra;
}
function carnetHtml() {
  var rows = RIDDLES.slice(0, RIDDLES.length - 1).map(function (q, k) { return (k + 1) + ". " + q.show; }).join("<br>");
  return '<div class="hint"><b>Votre carnet de réponses</b><br>' + rows + "</div>";
}
function sealsHtml() {
  var out = "";
  for (var j = 0; j < RIDDLES.length; j++) {
    var done = j < st.i || (j === st.i && st.solved);
    var cls = done ? "seal done" : (j === st.i ? "seal current" : "seal");
    out += '<li class="' + cls + '" aria-label="Sceau ' + (j + 1) + (done ? ", brisé" : "") + '">' + (done ? "✓" : (j + 1)) + "</li>";
  }
  return '<ul class="seals">' + out + "</ul>";
}

function renderIntro() {
  app.innerHTML =
    '<div class="wrap">' +
    '<h1 class="display title">Le Grimoire maudit</h1>' +
    '<p class="lead">La sorcière a enfermé la potion de la soirée dans son grimoire. Cinq sceaux le protègent. Brisez-les tous pour le rouvrir.</p>' +
    '<ul class="rules">' +
    "<li>Il vous faut un téléphone pour valider les réponses.</li>" +
    "<li>Comptez 30 à 40 minutes, en équipe. La dernière énigme réutilise les réponses précédentes.</li>" +
    "<li>Un quiz d’Halloween de 8 questions termine la partie et peut réduire votre temps final.</li>" +
    "<li>Bloqué&nbsp;? Chaque énigme a un indice, mais chaque indice ajoute 2 minutes à votre temps final.</li>" +
    "</ul>" +
    '<label for="team">Nom de votre équipe</label>' +
    '<input type="text" id="team" maxlength="30" autocomplete="off" style="margin-bottom:1.5rem">' +
    '<div class="actions">' +
    '<button class="btn" id="go">Ouvrir le grimoire</button>' +
    '<button class="btn ghost" id="print">Voir les fiches à imprimer</button>' +
    "</div></div>";
  document.getElementById("go").onclick = startGame;
  document.getElementById("print").onclick = function () { st.screen = "print"; render(); };
}

function renderGame() {
  var r = RIDDLES[st.i];
  var last = st.i === RIDDLES.length - 1;
  var html =
    '<div class="wrap">' +
    '<div class="top"><span class="brand display">' + esc(st.team || "Le Grimoire maudit") + '</span><span class="timer" id="timer" aria-label="Temps écoulé">' + mmss(st.secs) + "</span></div>" +
    sealsHtml() +
    '<section class="page">' +
    '<h2 class="display page-title">' + r.title + "</h2>" +
    '<p class="riddle">' + r.text + "</p>" +
    altarExtra(r) +
    (st.i === RIDDLES.length - 1 ? carnetHtml() : "");
  if (st.solved) {
    html +=
      '<p class="answer-line">' + r.show + "</p>" +
      '<p class="msg good" aria-live="polite">Sceau brisé&nbsp;!</p>' +
      '<div class="row"><button class="btn" id="next">' + (last ? "Ouvrir le grimoire" : "Énigme suivante") + "</button></div>";
  } else {
    html +=
      '<form id="form" autocomplete="off">' +
      '<label for="ans">Votre réponse</label>' +
      '<input type="text" id="ans" name="ans" autocomplete="off" autocapitalize="off" spellcheck="false"' + (r.mode === "numeric" ? ' inputmode="numeric"' : "") + ">" +
      '<p class="msg" id="msg" aria-live="polite"></p>' +
      '<div class="row"><button class="btn" type="submit">Briser le sceau</button>' +
      '<button class="btn ghost" type="button" id="hintbtn">Un indice (+2&nbsp;min)</button></div>' +
      "</form>" +
      '<div id="hintbox">' + (st.hintsShown[st.i] ? '<p class="hint">' + r.hint + "</p>" : "") + "</div>";
  }
  html += "</section></div>";
  app.innerHTML = html;

  if (st.solved) {
    document.getElementById("next").onclick = function () {
      if (last) { finish(); } else { st.i++; st.solved = false; render(); }
    };
  } else {
    var form = document.getElementById("form");
    var input = document.getElementById("ans");
    var msg = document.getElementById("msg");
    form.onsubmit = function (e) {
      e.preventDefault();
      if (check(r, input.value)) {
        st.solved = true; render();
      } else {
        msg.textContent = input.value.trim() ? "Ce n’est pas le bon mot. Relisez la fiche et réessayez." : "Écrivez une réponse avant de valider.";
        msg.className = "msg bad";
        input.classList.remove("shake");
        void input.offsetWidth;
        input.classList.add("shake");
        input.select();
      }
    };
    document.getElementById("hintbtn").onclick = function () {
      st.hintsShown[st.i] = true;
      document.getElementById("hintbox").innerHTML = '<p class="hint">' + r.hint + "</p>";
    };
  }
}

function finish() {
  clearInterval(st.timer);
  tick();
  st.q = 0;
  st.score = 0;
  st.screen = "quiz";
  render();
}

function renderWin() {
  var m = Math.floor(st.secs / 60), s = st.secs % 60;
  var h = hintCount();
  app.innerHTML =
    '<div class="wrap">' +
    '<h1 class="display title">Le grimoire est ouvert&nbsp;!</h1>' +
    sealsHtml().replace(/seal current/g, "seal done") +
    '<p class="lead">Bravo, les cinq sceaux sont brisés.</p>' +
    '<div class="page" style="margin-bottom:1.25rem"><h2 class="display page-title">' + esc(st.team || "Votre équipe") + '</h2>' +
    '<p class="riddle">Temps final&nbsp;: <b>' + mmss(Math.max(0, st.secs + h * 120 - st.score * 30)) + '</b></p>' +
    '<p class="stats">Temps de jeu&nbsp;: ' + m + "&nbsp;min " + s + "&nbsp;s. Indices&nbsp;: +" + (h * 2) + "&nbsp;min. Quiz&nbsp;: " + st.score + "/" + QUIZ.length + " bonnes réponses, −" + (st.score * 30) + "&nbsp;s. Terminé à " + esc(st.endClock || "") + ". Montrez cet écran à l’organisatrice.</p></div>" +
    '<div class="page"><h2 class="display page-title">Dernière mission</h2>' +
    "<p class=\"riddle\">L’organisatrice a caché la potion de la sorcière quelque part dans la maison. À vous de la retrouver&nbsp;!</p></div>" +
    '<div class="actions" style="margin-top:1.5rem"><button class="btn ghost" id="again">Rejouer</button></div>' +
    "</div>";
  document.getElementById("again").onclick = function () { st.screen = "intro"; render(); };
}

function renderPrint() {
  var fiches = RIDDLES.map(function (r, k) {
    return '<article class="fiche">' +
      '<p class="brand display">Le Grimoire maudit – Fiche ' + (k + 1) + " sur " + RIDDLES.length + "</p>" +
      '<h2 class="display page-title">' + r.title + "</h2>" +
      '<p class="riddle">' + r.text + "</p>" +
      altarExtra(r) +
      '<p class="blank-label">Notre réponse</p><div class="blank"></div>' +
      "</article>";
  }).join("");
  app.innerHTML =
    '<div class="wrap">' +
    '<div class="top no-print"><button class="btn ghost" id="back">Retour</button><button class="btn" id="doprint">Imprimer</button></div>' +
    '<p class="stats no-print">Une fiche par page. Cachez-les dans la pièce, puis les joueurs saisissent leurs réponses dans l’application.</p>' +
    fiches + quizPrint() + "</div>";
  document.getElementById("back").onclick = function () { st.screen = "intro"; render(); };
  document.getElementById("doprint").onclick = function () {
    try { window.print(); } catch (e) { alert("Utilisez la fonction Imprimer de votre navigateur."); }
  };
}

var QUIZ = [
  { q: "D’où vient la fête d’Halloween, à l’origine&nbsp;?", o: ["Des États-Unis", "D’Irlande", "Du Mexique", "De Roumanie"], a: 1, why: "Elle vient de Samain, une fête celtique irlandaise, exportée ensuite aux États-Unis par les émigrés irlandais." },
  { q: "Avant la citrouille, quel légume creusait-on pour en faire une lanterne&nbsp;?", o: ["Le chou", "La betterave", "Le navet", "Le poireau"], a: 2, why: "C’était le navet. La citrouille, plus grosse et plus facile à creuser, l’a remplacé en Amérique." },
  { q: "Que signifie «&nbsp;trick or treat&nbsp;»&nbsp;?", o: ["Une farce ou une friandise", "Un costume ou un masque", "Une chanson ou un cri", "Un jeu ou un cadeau"], a: 0, why: "Le « trick » est la farce promise si l’on ne reçoit pas de friandise." },
  { q: "Dans quel pays se trouve la Transylvanie, la région du comte Dracula&nbsp;?", o: ["La Hongrie", "La Roumanie", "L’Écosse", "La Bulgarie"], a: 1, why: "La Transylvanie est une région de Roumanie, où Bram Stoker a situé son roman." },
  { q: "Dans le roman de Mary Shelley, qui s’appelle Frankenstein&nbsp;?", o: ["Le monstre", "Le docteur qui le crée", "Le village", "Le laboratoire"], a: 1, why: "Frankenstein est le nom du docteur. La créature, elle, n’a pas de nom." },
  { q: "Selon la légende, qui n’a pas de reflet dans un miroir&nbsp;?", o: ["Le loup-garou", "La momie", "Le vampire", "Le squelette"], a: 2, why: "Dans la légende, le miroir ne reflète pas le vampire." },
  { q: "Quel est le seul mammifère capable de voler vraiment&nbsp;?", o: ["L’écureuil volant", "Le hibou", "La chauve-souris", "Le colibri"], a: 2, why: "C’est la chauve-souris. L’écureuil volant, lui, plane sans battre des ailes." },
  { q: "Selon la tradition, pourquoi allumait-on des lanternes sculptées à Halloween&nbsp;?", o: ["Pour éclairer les enfants", "Pour chasser les mauvais esprits", "Pour annoncer l’hiver", "Pour attirer les chauves-souris"], a: 1, why: "On pensait que leur visage effrayant éloignait les mauvais esprits." }
];

function renderQuiz() {
  var q = QUIZ[st.q];
  var opts = q.o.map(function (t, k) { return '<button class="opt" data-k="' + k + '">' + t + "</button>"; }).join("");
  app.innerHTML =
    '<div class="wrap">' +
    '<div class="top"><span class="brand display">' + esc(st.team || "Le Grimoire maudit") + '</span><span class="timer">Quiz ' + (st.q + 1) + "/" + QUIZ.length + "</span></div>" +
    '<section class="page"><h2 class="display page-title">Le quiz de la sorcière</h2>' +
    (st.q === 0 ? '<p class="stats">Le grimoire est ouvert, mais la sorcière pose une dernière épreuve. Chaque bonne réponse retire 30 secondes à votre temps final. Le chrono est arrêté.</p>' : "") +
    '<p class="riddle">' + q.q + '</p><div class="opts">' + opts + '</div>' +
    '<p class="msg" id="qmsg" aria-live="polite"></p><div class="row" id="qnext"></div></section></div>';
  var btns = app.querySelectorAll(".opt");
  Array.prototype.forEach.call(btns, function (b) {
    b.onclick = function () { answerQuiz(parseInt(b.getAttribute("data-k"), 10), btns); };
  });
}
function answerQuiz(k, btns) {
  var q = QUIZ[st.q], ok = k === q.a;
  if (ok) st.score++;
  Array.prototype.forEach.call(btns, function (b, j) {
    b.disabled = true;
    if (j === q.a) { b.className = "opt right"; b.textContent = "✓ " + q.o[j]; }
    else if (j === k) { b.className = "opt wrong"; b.textContent = "✗ " + q.o[j]; }
  });
  var msg = document.getElementById("qmsg");
  msg.className = "msg " + (ok ? "good" : "bad");
  msg.textContent = (ok ? "Bonne réponse. " : "Raté. ") + q.why;
  var last = st.q === QUIZ.length - 1;
  document.getElementById("qnext").innerHTML = '<button class="btn" id="qn">' + (last ? "Voir le résultat" : "Question suivante") + "</button>";
  var qn = document.getElementById("qn");
  qn.onclick = function () {
    if (last) { st.endClock = new Date().toLocaleTimeString("fr-BE"); st.screen = "win"; } else { st.q++; }
    render();
  };
  qn.focus();
}
function quizPrint() {
  var letters = "ABCD";
  var items = QUIZ.map(function (q, k) {
    return '<p class="riddle"><b>' + (k + 1) + ".</b> " + q.q + "<br>" + q.o.map(function (t, j) { return letters[j] + "&nbsp;: " + t; }).join("<br>") + "</p>";
  }).join("");
  return '<article class="fiche"><p class="brand display">Le Grimoire maudit – Quiz</p><h2 class="display page-title">Le quiz de la sorcière</h2>' + items + "</article>";
}

function render() {
  if (st.screen === "intro") renderIntro();
  else if (st.screen === "game") renderGame();
  else if (st.screen === "quiz") renderQuiz();
  else if (st.screen === "win") renderWin();
  else renderPrint();
  window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>
