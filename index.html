<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Grimoire maudit – Escape game d’Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Metamorphous&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2e7cf;
  --surface: #fbf4e2;
  --ink: #2b1638;
  --muted: #5f4a6b;
  --accent: #c24a0a;
  --accent-ink: #fff8ee;
  --ok: #2f7d32;
  --warn: #a4262c;
  --line: #cdb98f;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c0f2a;
    --surface: #2a1740;
    --ink: #f1e6cf;
    --muted: #bba9cb;
    --accent: #ff8a2b;
    --accent-ink: #2b1200;
    --ok: #9be564;
    --warn: #ff9a9a;
    --line: #4d3269;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c0f2a;
  --surface: #2a1740;
  --ink: #f1e6cf;
  --muted: #bba9cb;
  --accent: #ff8a2b;
  --accent-ink: #2b1200;
  --ok: #9be564;
  --warn: #ff9a9a;
  --line: #4d3269;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 1.2rem;
  line-height: 1.5;
}
.display { font-family: "Metamorphous", Georgia, "Times New Roman", serif; font-weight: 400; }
.wrap { max-width: 36rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
.brand { font-size: 1.05rem; color: var(--muted); }
.timer { font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--accent); }
h1.title { font-size: clamp(2.3rem, 9vw, 3.2rem); line-height: 1.1; margin: 2rem 0 1rem; }
h2.page-title { font-size: 1.6rem; line-height: 1.2; margin: 0 0 1rem; }
.kind { margin: 0 0 .25rem; color: var(--muted); font-size: 1rem; }
.lead { font-size: 1.3rem; }
.rules { margin: 1.25rem 0 2rem; padding-left: 1.2rem; color: var(--muted); }
.rules li { margin-bottom: .35rem; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  min-height: 3rem; padding: .7rem 1.3rem;
  border: 2px solid var(--accent); border-radius: .4rem;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, input:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.seals { display: flex; flex-wrap: wrap; gap: .3rem; justify-content: center; margin: 0 0 1.5rem; padding: 0; list-style: none; }
.seal {
  width: clamp(1.7rem, 7.5vw, 2.4rem); height: clamp(1.7rem, 7.5vw, 2.4rem); border-radius: 50%;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-family: "Metamorphous", Georgia, serif; font-size: .85rem; color: var(--muted);
}
.seal.q { border-radius: .35rem; }
.seal.current { border-color: var(--accent); color: var(--accent); border-width: 3px; }
.seal.done { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.page {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: .4rem; padding: 1.5rem 1.4rem;
}
.riddle { font-size: 1.3rem; margin: 0 0 1rem; }
.code { font-family: "Metamorphous", Georgia, serif; font-size: 1.8rem; letter-spacing: .25em; text-align: center; margin: 1.25rem 0; }
.alpha { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.2rem, 1fr)); gap: .3rem; font-size: .95rem; margin: 1rem 0; color: var(--muted); }
.alpha span { border: 1px solid var(--line); border-radius: .25rem; padding: .1rem .35rem; text-align: center; }
.alpha b { color: var(--ink); }
.poem, .statements { margin: 1rem 0; border-left: 4px solid var(--line); padding: .3rem 0 .3rem 1.1rem; }
.poem { font-style: italic; }
.statements { list-style-position: inside; }
ul.statements { list-style: none; }
.statements li { margin: .45rem 0; }
.opts { display: grid; gap: .6rem; margin: 1rem 0; }
.opt { font: inherit; text-align: left; min-height: 3rem; padding: .7rem 1rem; border: 2px solid var(--line); border-radius: .4rem; background: var(--bg); color: var(--ink); cursor: pointer; }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.right, .opt.right:disabled { background: var(--ok); border-color: var(--ok); color: var(--bg); font-weight: 700; }
.opt.wrong, .opt.wrong:disabled { border-color: var(--warn); color: var(--warn); font-weight: 700; }
label { display: block; font-weight: 700; margin: 1.25rem 0 .4rem; }
input[type="text"] {
  width: 100%; font: inherit; padding: .7rem .8rem;
  border: 2px solid var(--line); border-radius: .4rem;
  background: var(--bg); color: var(--ink);
}
.row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }
.msg { min-height: 1.6em; margin: .9rem 0 0; font-weight: 500; }
.msg.bad { color: var(--warn); }
.msg.good { color: var(--ok); }
.hint { margin-top: 1rem; padding: .8rem 1rem; border-left: 4px solid var(--accent); background: var(--bg); }
.answer-line { font-family: "Metamorphous", Georgia, serif; font-size: 1.3rem; color: var(--ok); margin: 0 0 .5rem; }
.stats { color: var(--muted); margin: .5rem 0 1.5rem; }
.fiche { background: var(--surface); border: 1px solid var(--line); border-radius: .4rem; padding: 1.5rem 1.4rem; margin-bottom: 1.25rem; }
.fiche .blank { margin-top: 1.5rem; border-bottom: 2px solid var(--ink); height: 2.2rem; }
.fiche .blank-label { font-weight: 700; margin-top: 1.25rem; }
@media (prefers-reduced-motion: no-preference) {
  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
}
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #000; --accent: #000; --ok: #000;
    padding: 0;
  }
  .no-print { display: none !important; }
  body { font-size: 15pt; }
  .fiche { page-break-after: always; break-after: page; border: 2px solid #000; padding: 2rem; margin: 0; }
  .fiche:last-child { page-break-after: auto; break-after: auto; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
var STEPS = [
  {
    kind: "quiz",
    q: "D’où vient la fête d’Halloween, à l’origine&nbsp;?",
    o: ["Des États-Unis", "D’Irlande", "Du Mexique", "De Roumanie"],
    a: 1,
    why: "Elle vient de Samain, une fête celtique irlandaise, exportée ensuite aux États-Unis par les émigrés irlandais."
  },
  {
    kind: "riddle",
    title: "Le sceau du voleur",
    text: "La potion de la sorcière a été volée par l’un de ces trois suspects. Un seul dit la vérité, les deux autres mentent. Qui est le voleur&nbsp;?",
    extra: '<ul class="statements"><li><b>Le Fantôme</b>&nbsp;: «&nbsp;Ce n’est pas moi.&nbsp;»</li><li><b>Le Squelette</b>&nbsp;: «&nbsp;C’est le Fantôme.&nbsp;»</li><li><b>La Momie</b>&nbsp;: «&nbsp;Ce n’est pas le Squelette.&nbsp;»</li></ul>',
    answers: ["squelette"],
    show: "SQUELETTE",
    hint: "Supposez que le voleur est le Fantôme, puis le Squelette, puis la Momie. À chaque fois, comptez combien de phrases sont vraies&nbsp;: il doit y en avoir une seule."
  },
  {
    kind: "quiz",
    q: "Avant la citrouille, quel légume creusait-on pour en faire une lanterne&nbsp;?",
    o: ["Le chou", "La betterave", "Le navet", "Le poireau"],
    a: 2,
    why: "C’était le navet. La citrouille, plus grosse et plus facile à creuser, l’a remplacé en Amérique."
  },
  {
    kind: "riddle",
    title: "Le sceau du code",
    text: "Le feuillet suivant est écrit en code. Chaque lettre a été remplacée par celle qui se trouve 3 rangs plus loin dans l’alphabet&nbsp;: A devient D, B devient E, et ainsi de suite. Pour décoder, il faut reculer de 3 rangs. Quelle créature des contes, grande et gourmande, se cache ici&nbsp;?",
    extra: "code",
    answers: ["ogre"],
    show: "OGRE",
    hint: "R recule de 3 rangs&nbsp;: Q, P, O. La première lettre est donc O."
  },
  {
    kind: "quiz",
    q: "Que signifie «&nbsp;trick or treat&nbsp;»&nbsp;?",
    o: ["Une farce ou une friandise", "Un costume ou un masque", "Une chanson ou un cri", "Un jeu ou un cadeau"],
    a: 0,
    why: "Le «&nbsp;trick&nbsp;» est la farce promise si l’on ne reçoit pas de friandise."
  },
  {
    kind: "riddle",
    title: "Le sceau du poème",
    text: "Sur le feuillet suivant, un poème. Il cache le nom d’une créature de la nuit, un esprit qui ne repose pas en paix. À vous de le trouver.",
    extra: '<p class="poem">Rien ne bouge dans la vieille maison,<br>Entre les murs, un souffle, une chanson.<br>Voilà que la porte grince doucement,<br>Et l’escalier craque on ne sait comment.<br>Nul ne voit l’ombre qui glisse sur le sol,<br>Au fond du couloir, elle prend son envol.<br>Nuit après nuit, elle revient sans bruit,<br>Tremblez, il est là, caché dans la nuit.</p>',
    answers: ["revenant"],
    show: "REVENANT",
    hint: "Regardez la première lettre de chaque vers."
  },
  {
    kind: "quiz",
    q: "Dans le roman de Mary Shelley, qui s’appelle Frankenstein&nbsp;?",
    o: ["Le monstre", "Le docteur qui le crée", "Le village", "Le laboratoire"],
    a: 1,
    why: "Frankenstein est le nom du docteur. La créature, elle, n’a pas de nom."
  },
  {
    kind: "riddle",
    title: "Le sceau du tisserand",
    text: "Je suis fine, mais très solide. Personne ne m’a tricotée&nbsp;: une petite bête à huit pattes me tisse dans un coin de la cave. Les mouches s’y collent et n’en repartent pas. Qui suis-je&nbsp;?",
    extra: "",
    answers: ["toile"],
    show: "TOILE",
    hint: "Je suis faite de fils de soie et je brille quand la rosée se dépose sur moi."
  },
  {
    kind: "quiz",
    q: "Quel est le seul mammifère capable de voler vraiment&nbsp;?",
    o: ["L’écureuil volant", "Le hibou", "La chauve-souris", "Le colibri"],
    a: 2,
    why: "C’est la chauve-souris. L’écureuil volant, lui, plane sans battre des ailes."
  },
  {
    kind: "riddle",
    title: "Le dernier sceau",
    text: "Pour ouvrir le grimoire, écrivez vos réponses aux énigmes 1, 2, 3 et 4 l’une sous l’autre. Lisez la première lettre de chacune, de haut en bas&nbsp;: elles forment le mot que la sorcière lance à ceux qui ne donnent pas de bonbons.",
    extra: "",
    answers: ["sort"],
    show: "SORT",
    hint: "Dans «&nbsp;des bonbons ou un…&nbsp;», c’est le mot qui manque."
  }
];

var ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
var CODE = "RJUH";
var HINT_COST = 30, WRONG_COST = 30;

var app = document.getElementById("app");
var st = { screen: "intro", i: 0, solved: false, hintsShown: {}, tried: {}, wrong: 0, start: 0, secs: 0, timer: null, team: "", endClock: "" };

function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}
function check(s, value) {
  var v = norm(value);
  if (!v) return false;
  return s.answers.some(function (a) { return v.indexOf(a) !== -1; });
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
}
function mmss(s) {
  var m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
}
function hintCount() { return Object.keys(st.hintsShown).length; }
function tick() {
  st.secs = Math.floor((Date.now() - st.start) / 1000);
  var t = document.getElementById("timer");
  if (t) t.textContent = mmss(st.secs);
}
function startGame() {
  var tf = document.getElementById("team");
  st.team = tf ? tf.value.trim() : "";
  st.screen = "game"; st.i = 0; st.solved = false; st.hintsShown = {}; st.tried = {}; st.wrong = 0;
  st.start = Date.now(); st.secs = 0;
  clearInterval(st.timer);
  st.timer = setInterval(tick, 1000);
  render();
}
function rank(i) {
  var k = STEPS[i].kind, n = 0;
  for (var j = 0; j <= i; j++) if (STEPS[j].kind === k) n++;
  return n;
}
function kindLabel(i) {
  return (STEPS[i].kind === "quiz" ? "Question " : "Énigme ") + rank(i) + " sur 5";
}
function extraHtml(s) {
  if (s.extra === "code") {
    var cells = ALPHABET.map(function (l) { return "<span><b>" + l + "</b></span>"; }).join("");
    return '<p class="code" aria-label="Message codé">' + CODE + '</p><div class="alpha" aria-label="Alphabet">' + cells + "</div>";
  }
  return s.extra || "";
}
function carnetHtml() {
  var rows = [];
  STEPS.forEach(function (s, k) {
    if (s.kind === "riddle" && k !== STEPS.length - 1) rows.push("Énigme " + rank(k) + " : " + s.show);
  });
  return '<div class="hint"><b>Votre carnet de réponses</b><br>' + rows.join("<br>") + "</div>";
}
function sealsHtml(all) {
  var out = "";
  for (var j = 0; j < STEPS.length; j++) {
    var done = all || j < st.i || (j === st.i && st.solved);
    var cls = "seal" + (STEPS[j].kind === "quiz" ? " q" : "") + (done ? " done" : (j === st.i ? " current" : ""));
    out += '<li class="' + cls + '" aria-label="' + kindLabel(j) + (done ? ", validée" : "") + '">' + (done ? "✓" : (j + 1)) + "</li>";
  }
  return '<ul class="seals">' + out + "</ul>";
}

function renderIntro() {
  app.innerHTML =
    '<div class="wrap">' +
    '<h1 class="display title">Le Grimoire maudit</h1>' +
    '<p class="lead">Êtes-vous de petits monstres malins&nbsp;? Plus malins qu’Einstein&nbsp;? Dix sceaux protègent le grimoire de la sorcière. Brisez-les tous pour l’ouvrir.</p>' +
    '<ul class="rules">' +
    "<li>Il vous faut un téléphone pour valider les réponses.</li>" +
    "<li>Dix épreuves en équipe, en alternance&nbsp;: 5 questions d’Halloween et 5 énigmes. Comptez environ 40 minutes.</li>" +
    "<li>Bloqué sur une énigme&nbsp;? Un indice ajoute 30 secondes. Une mauvaise réponse à une question ajoute aussi 30 secondes.</li>" +
    "<li>L’équipe qui a le temps final le plus court gagne.</li>" +
    "</ul>" +
    '<label for="team">Nom de votre équipe</label>' +
    '<input type="text" id="team" maxlength="30" autocomplete="off" style="margin-bottom:1.5rem">' +
    '<div class="actions">' +
    '<button class="btn" id="go">Ouvrir le grimoire</button>' +
    '<button class="btn ghost" id="print">Voir les fiches à imprimer</button>' +
    "</div></div>";
  document.getElementById("go").onclick = startGame;
  document.getElementById("print").onclick = function () { st.screen = "print"; render(); };
}

function quizBody(s) {
  var tried = st.tried[st.i] || [];
  var opts = s.o.map(function (t, k) {
    var cls = "opt", txt = t, dis = st.solved;
    if (st.solved && k === s.a) { cls += " right"; txt = "✓ " + t; }
    else if (tried.indexOf(k) !== -1) { cls += " wrong"; txt = "✗ " + t; dis = true; }
    return '<button class="' + cls + '" data-k="' + k + '"' + (dis ? " disabled" : "") + ">" + txt + "</button>";
  }).join("");
  return '<p class="riddle">' + s.q + '</p><div class="opts">' + opts + "</div>" +
    '<p class="msg' + (st.solved ? " good" : "") + '" id="msg" aria-live="polite">' + (st.solved ? "Bonne réponse. " + s.why : "") + "</p>" +
    (st.solved ? '<div class="row"><button class="btn" id="next">Épreuve suivante</button></div>' : "");
}
function riddleBody(s, last) {
  var html = '<p class="riddle">' + s.text + "</p>" + extraHtml(s) + (last ? carnetHtml() : "");
  if (st.solved) {
    html += '<p class="answer-line">' + s.show + "</p>" +
      '<p class="msg good" aria-live="polite">Sceau brisé&nbsp;!</p>' +
      '<div class="row"><button class="btn" id="next">' + (last ? "Ouvrir le grimoire" : "Épreuve suivante") + "</button></div>";
  } else {
    html += '<form id="form" autocomplete="off">' +
      '<label for="ans">Votre réponse</label>' +
      '<input type="text" id="ans" name="ans" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<p class="msg" id="msg" aria-live="polite"></p>' +
      '<div class="row"><button class="btn" type="submit">Briser le sceau</button>' +
      '<button class="btn ghost" type="button" id="hintbtn">Un indice (+30&nbsp;s)</button></div>' +
      "</form>" +
      '<div id="hintbox">' + (st.hintsShown[st.i] ? '<p class="hint">' + s.hint + "</p>" : "") + "</div>";
  }
  return html;
}

function renderGame() {
  var s = STEPS[st.i];
  var last = st.i === STEPS.length - 1;
  app.innerHTML =
    '<div class="wrap">' +
    '<div class="top"><span class="brand display">' + esc(st.team || "Le Grimoire maudit") + '</span><span class="timer" id="timer" aria-label="Temps écoulé">' + mmss(st.secs) + "</span></div>" +
    sealsHtml(false) +
    '<section class="page"><p class="kind">' + kindLabel(st.i) + "</p>" +
    '<h2 class="display page-title">' + (s.kind === "quiz" ? "Question d’Halloween" : s.title) + "</h2>" +
    (s.kind === "quiz" ? quizBody(s) : riddleBody(s, last)) +
    "</section></div>";

  var next = document.getElementById("next");
  if (next) next.onclick = function () {
    if (last) { finish(); } else { st.i++; st.solved = false; render(); }
  };
  if (st.solved) return;

  if (s.kind === "quiz") {
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.onclick = function () {
        var k = parseInt(b.getAttribute("data-k"), 10);
        if (k === s.a) { st.solved = true; render(); return; }
        st.wrong++;
        (st.tried[st.i] = st.tried[st.i] || []).push(k);
        b.disabled = true; b.className = "opt wrong"; b.textContent = "✗ " + s.o[k];
        var m = document.getElementById("msg");
        m.className = "msg bad"; m.textContent = "Raté, +30 secondes. Essayez encore.";
      };
    });
  } else {
    var input = document.getElementById("ans");
    var msg = document.getElementById("msg");
    document.getElementById("form").onsubmit = function (e) {
      e.preventDefault();
      if (check(s, input.value)) { st.solved = true; render(); return; }
      msg.textContent = input.value.trim() ? "Ce n’est pas le bon mot. Relisez la fiche et réessayez." : "Écrivez une réponse avant de valider.";
      msg.className = "msg bad";
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.select();
    };
    document.getElementById("hintbtn").onclick = function () {
      st.hintsShown[st.i] = true;
      document.getElementById("hintbox").innerHTML = '<p class="hint">' + s.hint + "</p>";
    };
  }
}

function finish() {
  clearInterval(st.timer);
  tick();
  st.endClock = new Date().toLocaleTimeString("fr-BE");
  st.screen = "win";
  render();
}

function renderWin() {
  var h = hintCount();
  var final = st.secs + h * HINT_COST + st.wrong * WRONG_COST;
  var m = Math.floor(st.secs / 60), s = st.secs % 60;
  app.innerHTML =
    '<div class="wrap">' +
    '<h1 class="display title">Le grimoire est ouvert&nbsp;!</h1>' +
    sealsHtml(true) +
    '<div class="page" style="margin-bottom:1.25rem"><h2 class="display page-title">' + esc(st.team || "Votre équipe") + "</h2>" +
    '<p class="riddle">Temps final&nbsp;: <b>' + mmss(final) + "</b></p>" +
    '<p class="stats">Temps de jeu&nbsp;: ' + m + "&nbsp;min " + s + "&nbsp;s. Indices&nbsp;: " + h + ", soit +" + (h * 30) + "&nbsp;s. Mauvaises réponses aux questions&nbsp;: " + st.wrong + ", soit +" + (st.wrong * 30) + "&nbsp;s. Terminé à " + esc(st.endClock) + ". Montrez cet écran à l’organisatrice.</p></div>" +
    '<div class="page"><h2 class="display page-title">Et maintenant&nbsp;?</h2>' +
    '<p class="riddle">Dès que la sorcière de la maison aura fait les comptes, on saura qui sont les meilleurs Frankenstein de la soirée&nbsp;!</p></div>' +
    '<div class="actions" style="margin-top:1.5rem"><button class="btn ghost" id="again">Rejouer</button></div>' +
    "</div>";
  document.getElementById("again").onclick = function () { st.screen = "intro"; render(); };
}

function renderPrint() {
  var letters = "ABCD";
  var fiches = STEPS.map(function (s, k) {
    var head = '<p class="brand display">Le Grimoire maudit – Épreuve ' + (k + 1) + " sur " + STEPS.length + "</p>" +
      '<p class="kind">' + kindLabel(k) + "</p>";
    if (s.kind === "quiz") {
      return '<article class="fiche">' + head +
        '<h2 class="display page-title">Question d’Halloween</h2>' +
        '<p class="riddle">' + s.q + "</p>" +
        '<p class="riddle">' + s.o.map(function (t, j) { return "<b>" + letters[j] + "</b>&nbsp;: " + t; }).join("<br>") + "</p>" +
        '<p class="blank-label">Notre réponse (A, B, C ou D)</p><div class="blank"></div></article>';
    }
    return '<article class="fiche">' + head +
      '<h2 class="display page-title">' + s.title + "</h2>" +
      '<p class="riddle">' + s.text + "</p>" + extraHtml(s) +
      '<p class="blank-label">Notre réponse</p><div class="blank"></div></article>';
  }).join("");
  app.innerHTML =
    '<div class="wrap">' +
    '<div class="top no-print"><button class="btn ghost" id="back">Retour</button><button class="btn" id="doprint">Imprimer</button></div>' +
    '<p class="stats no-print">Une fiche par page, dans l’ordre des épreuves. Conseil&nbsp;: dans la fenêtre d’impression, choisissez 2 pages par feuille.</p>' +
    fiches + "</div>";
  document.getElementById("back").onclick = function () { st.screen = "intro"; render(); };
  document.getElementById("doprint").onclick = function () {
    try { window.print(); } catch (e) { alert("Utilisez la fonction Imprimer de votre navigateur."); }
  };
}

function render() {
  if (st.screen === "intro") renderIntro();
  else if (st.screen === "game") renderGame();
  else if (st.screen === "win") renderWin();
  else renderPrint();
  window.scrollTo(0, 0);
}
render();
</script>
</body>
</html>
